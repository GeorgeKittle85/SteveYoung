# =============================================================================
#  Cloudflare Tunnel configuration
#
#  Deployed as ~/.cloudflared/config-px.yml on this host (a dedicated file per
#  tunnel, alongside its other independent tunnels) with the tunnel UUID and
#  credentials path filled in — see scripts/setup-cloudflare-tunnel.sh for the
#  single-tunnel-host version of this flow.
#
#  cloudflared holds an outbound-only connection to the Cloudflare edge and
#  forwards matching requests to the local nginx instance. No inbound firewall
#  rule and no public IP are required on this host.
#
#  Reference: https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/configure-tunnels/local-management/configuration-file/
# =============================================================================

# The tunnel's UUID (preferred) or its name. `cloudflared tunnel list` prints
# both; the setup script rewrites this line automatically.
tunnel: REPLACE_WITH_TUNNEL_ID

# Credentials minted by `cloudflared tunnel create`. This file is a secret —
# it authenticates as the tunnel. Never commit it.
# The setup script rewrites this to the real path. It is ~/.cloudflared/<id>.json
# for a user-run tunnel and /etc/cloudflared/<id>.json for the system service —
# not /root/ unless you actually run as root.
credentials-file: REPLACE_WITH_CREDENTIALS_PATH

# --- Connection tuning -------------------------------------------------------
# Four edge connections (the default) spread over two Cloudflare data centres.
# "http2" (TCP), not "quic" or "auto": this host is on Wi-Fi and its UDP/7844
# path to Cloudflare only half-works. cloudflared's own precheck reports
# "UDP Connectivity: QUIC connection failed", yet "auto" still lands every
# connection on QUIC, where it then sees steady packet loss and periodic
# "timeout: no recent network activity" drops that kill the browser's
# websocket mid-session. Pinning http2 takes UDP out of the picture.
protocol: http2
loglevel: info
transport-loglevel: warn
no-autoupdate: true
# Prometheus metrics + /ready health endpoint. Must be unique per tunnel on a
# host that runs several — and must sit OUTSIDE 20241-20245, which is the range
# cloudflared auto-assigns from when a config omits `metrics:` (the defaults are
# compiled into the binary: `strings $(command -v cloudflared) | grep 20241`).
# A pinned port inside that range is a race: the other tunnels on this host do
# not pin one, so whichever starts first can take it, and this tunnel then dies
# at startup with "bind: address already in use" instead of falling back.
metrics: 127.0.0.1:20250
retries: 5
grace-period: 30s

# --- Ingress rules -----------------------------------------------------------
#
#  Evaluated top to bottom; the FIRST match wins, so the catch-all must be last.
#  Every rule except the catch-all needs a hostname (and may add a path regex).
#
#  This hostname points at the local nginx on port 80 — nginx then routes by
#  path (see nginx/nginx.conf). Keeping the routing in nginx means you change
#  one file, not two, when a backend moves.
#
ingress:
  # ---- px.tinyorbit.org -------------------------------------------------------
  # Everything for this tunnel goes through nginx on one hostname; /api/ and
  # /ws/ under it already route to the api and websocket backends (see
  # nginx/nginx.conf), so no separate api.px.tinyorbit.org rule is needed.
  - hostname: px.tinyorbit.org
    service: http://localhost:80
    originRequest:
      # nginx picks the vhost from this header, so it must be preserved.
      httpHostHeader: px.tinyorbit.org
      connectTimeout: 10s
      # Long enough for WebSockets and streaming responses to stay open.
      tcpKeepAlive: 30s
      keepAliveTimeout: 90s
      keepAliveConnections: 100
      noTLSVerify: false
      disableChunkedEncoding: false

  # ---- Example: route one path to a different local service -----------------
  # Uncomment to send /metrics straight to a monitoring process, bypassing nginx.
  # - hostname: px.tinyorbit.org
  #   path: ^/metrics
  #   service: http://localhost:9090

  # ---- Catch-all (REQUIRED, must be last) -----------------------------------
  # cloudflared refuses to start without a final rule that has no hostname.
  # Anything that did not match above gets a 404 instead of reaching nginx.
  - service: http_status:404
