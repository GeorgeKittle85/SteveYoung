# =============================================================================
#  Cloudflare Tunnel configuration
#
#  Installed to ~/.cloudflared/config.yml by scripts/setup-cloudflare-tunnel.sh,
#  which fills in the tunnel UUID and the credentials path for you.
#
#  cloudflared holds an outbound-only connection to the Cloudflare edge and
#  forwards matching requests to the local nginx instance. No inbound firewall
#  rule and no public IP are required on this host.
#
#  Reference: https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/configure-tunnels/local-management/configuration-file/
# =============================================================================

# The tunnel's UUID (preferred) or its name. `cloudflared tunnel list` prints
# both; the setup script rewrites this line automatically.
tunnel: REPLACE_WITH_TUNNEL_ID

# Credentials minted by `cloudflared tunnel create`. This file is a secret —
# it authenticates as the tunnel. Never commit it.
credentials-file: /root/.cloudflared/REPLACE_WITH_TUNNEL_ID.json

# --- Connection tuning -------------------------------------------------------
# Four edge connections (the default) spread over two Cloudflare data centres.
protocol: quic
loglevel: info
transport-loglevel: warn
no-autoupdate: true
metrics: 127.0.0.1:20241        # Prometheus metrics + /ready health endpoint
retries: 5
grace-period: 30s

# --- Ingress rules -----------------------------------------------------------
#
#  Evaluated top to bottom; the FIRST match wins, so the catch-all must be last.
#  Every rule except the catch-all needs a hostname (and may add a path regex).
#
#  All three hostnames point at the same local nginx on port 80 — nginx then
#  routes by Host header and path (see nginx/nginx.conf). Keeping the routing
#  in nginx means you change one file, not two, when a backend moves.
#
ingress:
  # ---- Apex domain ----------------------------------------------------------
  - hostname: example.com
    service: http://localhost:80
    originRequest:
      # nginx picks the vhost from this header, so it must be preserved.
      httpHostHeader: example.com
      connectTimeout: 10s
      # Long enough for WebSockets and streaming responses to stay open.
      tcpKeepAlive: 30s
      keepAliveTimeout: 90s
      keepAliveConnections: 100
      noTLSVerify: false
      disableChunkedEncoding: false

  # ---- www ------------------------------------------------------------------
  - hostname: www.example.com
    service: http://localhost:80
    originRequest:
      httpHostHeader: www.example.com
      connectTimeout: 10s
      tcpKeepAlive: 30s
      keepAliveTimeout: 90s
      keepAliveConnections: 100

  # ---- API ------------------------------------------------------------------
  # Also reaches nginx, which proxies it to the :5000 backend. To bypass nginx
  # and hit the API process directly, use `service: http://localhost:5000`.
  - hostname: api.example.com
    service: http://localhost:80
    originRequest:
      httpHostHeader: api.example.com
      connectTimeout: 10s
      tcpKeepAlive: 30s
      keepAliveTimeout: 90s
      keepAliveConnections: 100
      # WebSocket upgrades pass through untouched; no extra setting is needed.

  # ---- Example: route one path to a different local service -----------------
  # Uncomment to send /metrics straight to a monitoring process, bypassing nginx.
  # - hostname: example.com
  #   path: ^/metrics
  #   service: http://localhost:9090

  # ---- Catch-all (REQUIRED, must be last) -----------------------------------
  # cloudflared refuses to start without a final rule that has no hostname.
  # Anything that did not match above gets a 404 instead of reaching nginx.
  - service: http_status:404
