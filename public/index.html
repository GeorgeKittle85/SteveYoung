<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>px</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/scram/scramjet.all.js"></script>
  <script src="/baremux/index.js"></script>
  <script src="/proxy-setup.js"></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <header id="toolbar" class="toolbar">
    <div class="nav">
      <button id="back" type="button" title="Back" aria-label="Back">&#x2190;</button>
      <button id="forward" type="button" title="Forward" aria-label="Forward">&#x2192;</button>
      <button id="reload" type="button" title="Reload" aria-label="Reload">&#x21bb;</button>
      <button id="home" type="button" title="Home" aria-label="Home">&#x2302;</button>
    </div>
    <form id="nav-form" class="address" autocomplete="off">
      <input id="address" type="text" placeholder="Search or enter address" spellcheck="false" autocapitalize="off" autocorrect="off">
    </form>
    <div class="status">
      <span id="status-dot" class="dot" title="Starting"></span>
      <span id="who" class="who"></span>
    </div>
  </header>

  <main id="main">
    <section id="landing" class="landing">
      <h1>px</h1>
      <p class="tagline">Private browsing relay. Type an address or a search below.</p>
      <form id="landing-form" class="landing-form" autocomplete="off">
        <input id="landing-input" type="text" placeholder="Search or enter address" spellcheck="false" autocapitalize="off" autocorrect="off" autofocus>
        <button type="submit">Go</button>
      </form>
      <p id="landing-error" class="error" hidden></p>
    </section>
    <div id="frame-host" class="frame-host" hidden></div>
  </main>

  <footer class="foot">
    <a href="/credits.html" target="_blank" rel="noopener">Open-source components</a>
  </footer>
</body>
</html>
