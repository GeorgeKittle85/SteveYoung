# =============================================================================
#  nginx.conf — reverse proxy for the RandyMoss stack
#
#  Traffic path:  Internet -> Cloudflare edge -> Cloudflare Tunnel (cloudflared)
#                 -> nginx (this file, plain HTTP on :80) -> local backends
#
#  TLS is terminated at the Cloudflare edge and the tunnel itself is an
#  outbound-only, mutually authenticated QUIC/HTTP2 connection, so nginx does
#  not need certificates and no inbound port has to be opened on the host.
#
#  Domain: px.tinyorbit.org (see cloudflare/config.yml for the matching
#  tunnel ingress rule).
# =============================================================================

# NOTE: the `user` directive is intentionally omitted so nginx falls back to the
# account chosen at build time by your distribution (`www-data` on Debian/Ubuntu,
# `nginx` on RHEL/Alpine/nginx.org packages). Hard-coding the wrong name here
# makes `nginx -t` fail with `getpwnam(...) failed`.

worker_processes  auto;          # one worker per CPU core
worker_rlimit_nofile 65535;      # raise the per-worker file-descriptor ceiling

error_log  /var/log/nginx/error.log warn;

events {
    worker_connections  4096;    # max simultaneous connections per worker
    multi_accept        on;      # accept as many new connections as possible
}

http {
    # -------------------------------------------------------------------------
    #  Basics
    # -------------------------------------------------------------------------
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;          # send response headers in one packet
    tcp_nodelay     on;          # do not buffer small writes (matters for WS)
    server_tokens   off;         # do not advertise the nginx version

    keepalive_timeout   65;
    keepalive_requests  1000;
    types_hash_max_size 2048;

    client_max_body_size    25m; # bump this if you accept large uploads
    client_body_timeout     30s;
    client_header_timeout   30s;
    send_timeout            30s;

    # -------------------------------------------------------------------------
    #  Real client IP
    #
    #  Every request reaches nginx from cloudflared on the loopback interface, so
    #  without this block `$remote_addr` would always be 127.0.0.1 — access logs
    #  would be useless and the rate limits below would put *all* visitors into a
    #  single shared bucket. cloudflared forwards Cloudflare's `CF-Connecting-IP`
    #  header, which we trust because the only client allowed to talk to nginx is
    #  the local tunnel daemon (keep port 80 firewalled off from the outside).
    # -------------------------------------------------------------------------
    set_real_ip_from  127.0.0.1;
    set_real_ip_from  ::1;
    # set_real_ip_from 172.16.0.0/12;   # uncomment when running under Docker
    real_ip_header    CF-Connecting-IP;
    real_ip_recursive on;

    # -------------------------------------------------------------------------
    #  Logging — `cf_ray` lets you correlate an nginx line with a request in the
    #  Cloudflare dashboard, `upstream` shows which backend served it.
    # -------------------------------------------------------------------------
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                      'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time '
                      'cf_ray=$http_cf_ray';

    access_log  /var/log/nginx/access.log  main;

    # -------------------------------------------------------------------------
    #  Compression — Cloudflare compresses at the edge too, but compressing here
    #  keeps the tunnel hop cheap.
    # -------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/xml text/javascript
                      application/javascript application/json application/xml
                      application/rss+xml image/svg+xml font/woff font/woff2;

    # -------------------------------------------------------------------------
    #  WebSocket plumbing
    #
    #  `Connection` is a hop-by-hop header, so it must be regenerated for the
    #  upstream leg: `upgrade` while a handshake is in flight, `close` otherwise.
    #  Sending a bare `Connection: upgrade` on ordinary requests breaks keepalive.
    # -------------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # The edge always speaks HTTPS to the browser, so honour the header the
    # tunnel sets and only fall back to nginx's own scheme for local testing.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # -------------------------------------------------------------------------
    #  Rate limiting
    #
    #  `api_limit` is applied to /api/ only (see below). 10 r/s sustained with a
    #  burst of 20 absorbs normal UI bursts while stopping scripted abuse; the
    #  10 MB zone tracks roughly 160k distinct client IPs.
    #  `conn_limit` caps concurrent connections per client independently.
    # -------------------------------------------------------------------------
    limit_req_zone   $binary_remote_addr  zone=api_limit:10m   rate=10r/s;
    limit_conn_zone  $binary_remote_addr  zone=conn_limit:10m;
    limit_req_status  429;
    limit_conn_status 429;
    limit_req_log_level warn;

    # -------------------------------------------------------------------------
    #  Upstreams (all on the loopback interface of this host)
    #
    #  app_backend  :3000 + :3001  — web/app tier, load balanced
    #  api_backend  :5000          — REST API tier
    #  ws_backend   :3000 + :3001  — same processes as app_backend, but pinned
    #                                per client so a socket keeps talking to the
    #                                node that holds its session state
    #
    #  `least_conn` beats round-robin when response times vary. `max_fails` /
    #  `fail_timeout` give passive health checking: a backend that errors twice
    #  is pulled out of rotation for 15s (active health checks are nginx Plus).
    #  `keepalive` reuses upstream connections instead of reconnecting per request.
    # -------------------------------------------------------------------------
    upstream app_backend {
        least_conn;
        server 127.0.0.1:3000  max_fails=2 fail_timeout=15s;
        server 127.0.0.1:3001  max_fails=2 fail_timeout=15s;
        # server 127.0.0.1:3002 backup;   # only used when both above are down
        keepalive 32;
    }

    upstream api_backend {
        server 127.0.0.1:5000  max_fails=2 fail_timeout=15s;
        # Add more API workers here and they are load balanced automatically:
        # server 127.0.0.1:5001 max_fails=2 fail_timeout=15s;
        keepalive 16;
    }

    upstream ws_backend {
        # Sticky by real client IP. Do *not* use `ip_hash` here: every request
        # arrives from 127.0.0.1, so ip_hash would send all sockets to one node.
        hash $binary_remote_addr consistent;
        server 127.0.0.1:3000  max_fails=2 fail_timeout=15s;
        server 127.0.0.1:3001  max_fails=2 fail_timeout=15s;
    }

    # -------------------------------------------------------------------------
    #  Default server — anything arriving with an unexpected Host header is
    #  dropped without a response. Legitimate traffic always carries one of the
    #  hostnames declared in cloudflare/config.yml.
    # -------------------------------------------------------------------------
    server {
        listen      127.0.0.1:80 default_server;
        # Uncomment on hosts with IPv6 enabled (nginx refuses to start if the
        # kernel or container has no IPv6 stack, which is the Docker default):
        # listen    [::1]:80 default_server;
        server_name _;

        access_log off;
        return 444;   # nginx-specific: close the connection, send nothing
    }

    # =========================================================================
    #  px.tinyorbit.org — main application
    #
    #  Bound to loopback only: nothing but the local cloudflared connector can
    #  reach this host, so it never needs to be listed as a public listener.
    # =========================================================================
    server {
        listen      127.0.0.1:80;
        # listen    [::1]:80;             # enable on IPv6-capable hosts
        server_name px.tinyorbit.org;

        # Connection cap per client IP (applies to every location in this server).
        limit_conn conn_limit 50;

        # ---- Security headers ------------------------------------------------
        # Cloudflare adds HSTS at the edge when you enable it there; keep the
        # rest here so they survive even if you bypass the tunnel.
        add_header X-Content-Type-Options    "nosniff"        always;
        add_header X-Frame-Options           "SAMEORIGIN"     always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection          "0"              always;
        # add_header Content-Security-Policy "default-src 'self'" always;

        # ---- Health check ----------------------------------------------------
        # Cheap liveness probe answered by nginx itself: 200 means "the proxy is
        # up", independent of whether the backends are healthy. Used by the
        # setup scripts, by `docker compose` and by uptime monitors.
        location = /health {
            access_log off;
            add_header Content-Type application/json always;
            return 200 '{"status":"healthy","service":"nginx"}';
        }

        # Aggregate health of the app tier: proxied so a dead backend shows up.
        location = /health/upstream {
            access_log off;
            proxy_pass         http://app_backend/health;
            proxy_set_header   Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout    5s;
        }

        # ---- nginx runtime metrics (loopback only) ---------------------------
        location = /nginx-status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            allow ::1;
            deny  all;
        }

        # ---- API ------------------------------------------------------------
        # `^~` stops the static-asset regex below from ever stealing an /api/
        # path such as /api/v1/report.json.
        location ^~ /api/ {
            # Sustained 10 r/s, queue up to 20 more without artificial delay,
            # then answer 429. Raise `burst` before raising `rate`.
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://api_backend;

            proxy_http_version 1.1;
            proxy_set_header Connection "";          # enable upstream keepalive

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Request-ID      $request_id;

            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            # Retry the next upstream when one node fails mid-request.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            # APIs stream JSON; buffering only adds latency.
            proxy_buffering off;

            # Never let a proxied API response be cached by the edge or browser.
            add_header Cache-Control "no-store" always;
        }

        # ---- WebSockets ------------------------------------------------------
        location ^~ /ws/ {
            proxy_pass http://ws_backend;

            # HTTP/1.1 + the Upgrade/Connection pair is what turns a request
            # into a persistent bidirectional socket.
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            # A websocket is idle most of the time — without a long read timeout
            # nginx would close it after 60s. Cloudflare's own edge idle timeout
            # is 100s, so send application-level pings more often than that.
            proxy_connect_timeout 7s;
            proxy_send_timeout    1h;
            proxy_read_timeout    1h;

            proxy_buffering off;   # frames must not sit in a buffer
            proxy_cache     off;
        }

        # ---- Static assets ---------------------------------------------------
        # Served by the app tier but cached hard at the edge and in the browser.
        # Use fingerprinted filenames (app.4f2a1c.js) so `immutable` is safe.
        location ~* \.(?:css|js|mjs|json|map|jpg|jpeg|png|gif|webp|avif|svg|ico|woff|woff2|ttf|eot|mp4|webm)$ {
            proxy_pass http://app_backend;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            # Note: no `expires` directive here — it emits its own
            # `Cache-Control: max-age=...`, and the browser would receive two
            # conflicting Cache-Control headers. One explicit header is enough.
            add_header Cache-Control "public, max-age=2592000, immutable" always;
            access_log off;

            # Serve the last good copy if the backend dies or is being restarted.
            proxy_cache_bypass $http_pragma;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # ---- Everything else -> app tier -------------------------------------
        location / {
            proxy_pass http://app_backend;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Request-ID      $request_id;

            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            proxy_buffers      16 16k;
            proxy_buffer_size  32k;

            # Server-Sent Events and other streaming endpoints need this off;
            # uncomment if you serve them from the app tier.
            # proxy_buffering off;
        }

        # ---- Error pages -----------------------------------------------------
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            internal;
            add_header Content-Type text/html always;
            return 503 '<!doctype html><title>Service unavailable</title><h1>503 — backend unavailable</h1><p>The application is restarting. Please retry in a moment.</p>';
        }
    }

    # A dedicated api.px.tinyorbit.org vhost isn't set up — /api/ above already
    # reaches api_backend under the one hostname. Add one later the same way
    # SETUP.md describes ("Add a hostname") if a separate API host is wanted.
}
