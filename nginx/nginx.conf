# =============================================================================
#  nginx.conf — reverse proxy in front of the px.tinyorbit.org browser service
#
#  Traffic path:  Internet -> Cloudflare edge (+ Access login gate)
#                 -> Cloudflare Tunnel (cloudflared)
#                 -> nginx (this file, plain HTTP on :80)
#                 -> px-browser container (127.0.0.1:3000, see
#                    docker-compose.browser.yml)
#
#  TLS is terminated at the Cloudflare edge and the tunnel itself is an
#  outbound-only, mutually authenticated QUIC/HTTP2 connection, so nginx does
#  not need certificates and no inbound port has to be opened on the host.
#  Cloudflare Access sits in front of the whole hostname, so nginx itself does
#  not need to know anything about authentication — see SETUP.md.
#
#  Domain: px.tinyorbit.org (see cloudflare/config.yml for the matching
#  tunnel ingress rule).
# =============================================================================

# NOTE: the `user` directive is intentionally omitted so nginx falls back to the
# account chosen at build time by your distribution (`www-data` on Debian/Ubuntu,
# `nginx` on RHEL/Alpine/nginx.org packages). Hard-coding the wrong name here
# makes `nginx -t` fail with `getpwnam(...) failed`.

worker_processes  auto;          # one worker per CPU core
worker_rlimit_nofile 65535;      # raise the per-worker file-descriptor ceiling

error_log  /var/log/nginx/error.log warn;

events {
    worker_connections  4096;    # max simultaneous connections per worker
    multi_accept        on;      # accept as many new connections as possible
}

http {
    # -------------------------------------------------------------------------
    #  Basics
    # -------------------------------------------------------------------------
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;          # send response headers in one packet
    tcp_nodelay     on;          # do not buffer small writes (matters for WS)
    server_tokens   off;         # do not advertise the nginx version

    keepalive_timeout   65;
    keepalive_requests  1000;
    types_hash_max_size 2048;

    client_max_body_size    25m; # bump this if you accept large uploads
    client_body_timeout     30s;
    client_header_timeout   30s;
    send_timeout            30s;

    # -------------------------------------------------------------------------
    #  Real client IP
    #
    #  Every request reaches nginx from cloudflared on the loopback interface, so
    #  without this block `$remote_addr` would always be 127.0.0.1 — access logs
    #  would be useless and the rate limits below would put *all* visitors into a
    #  single shared bucket. cloudflared forwards Cloudflare's `CF-Connecting-IP`
    #  header, which we trust because the only client allowed to talk to nginx is
    #  the local tunnel daemon (keep port 80 firewalled off from the outside).
    # -------------------------------------------------------------------------
    set_real_ip_from  127.0.0.1;
    set_real_ip_from  ::1;
    # set_real_ip_from 172.16.0.0/12;   # uncomment when running under Docker
    real_ip_header    CF-Connecting-IP;
    real_ip_recursive on;

    # -------------------------------------------------------------------------
    #  Logging — `cf_ray` lets you correlate an nginx line with a request in the
    #  Cloudflare dashboard, `upstream` shows which backend served it.
    # -------------------------------------------------------------------------
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                      'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time '
                      'cf_ray=$http_cf_ray';

    access_log  /var/log/nginx/access.log  main;

    # -------------------------------------------------------------------------
    #  Compression — Cloudflare compresses at the edge too, but compressing here
    #  keeps the tunnel hop cheap.
    # -------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/xml text/javascript
                      application/javascript application/json application/xml
                      application/rss+xml image/svg+xml font/woff font/woff2;

    # -------------------------------------------------------------------------
    #  WebSocket plumbing
    #
    #  `Connection` is a hop-by-hop header, so it must be regenerated for the
    #  upstream leg: `upgrade` while a handshake is in flight, `close` otherwise.
    #  Sending a bare `Connection: upgrade` on ordinary requests breaks keepalive.
    # -------------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # The edge always speaks HTTPS to the browser, so honour the header the
    # tunnel sets and only fall back to nginx's own scheme for local testing.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # -------------------------------------------------------------------------
    #  Rate limiting
    #
    #  `conn_limit` caps concurrent connections per client IP — the only limit
    #  this single-backend deployment needs; the browser session itself is one
    #  long-lived connection per user, not a burst of short API calls.
    # -------------------------------------------------------------------------
    limit_conn_zone  $binary_remote_addr  zone=conn_limit:10m;
    limit_conn_status 429;

    # -------------------------------------------------------------------------
    #  Upstream — the containerized browser (docker-compose.browser.yml),
    #  published to the loopback interface only. A single instance: this is
    #  one shared remote-browser session for a small known group, not a
    #  horizontally-scaled app tier, so there is nothing to load-balance.
    #  `keepalive` reuses the upstream connection instead of reconnecting per
    #  request/frame.
    # -------------------------------------------------------------------------
    upstream browser_backend {
        server 127.0.0.1:3000  max_fails=2 fail_timeout=15s;
        keepalive 32;
    }

    # -------------------------------------------------------------------------
    #  Default server — anything arriving with an unexpected Host header is
    #  dropped without a response. Legitimate traffic always carries one of the
    #  hostnames declared in cloudflare/config.yml.
    # -------------------------------------------------------------------------
    server {
        listen      127.0.0.1:80 default_server;
        # Uncomment on hosts with IPv6 enabled (nginx refuses to start if the
        # kernel or container has no IPv6 stack, which is the Docker default):
        # listen    [::1]:80 default_server;
        server_name _;

        access_log off;
        return 444;   # nginx-specific: close the connection, send nothing
    }

    # =========================================================================
    #  px.tinyorbit.org — containerized browser proxy
    #
    #  Bound to loopback only: nothing but the local cloudflared connector can
    #  reach this host, so it never needs to be listed as a public listener.
    #  Cloudflare Access gates this hostname before traffic ever reaches the
    #  tunnel — see SETUP.md's "Security notes" — so there is no auth logic
    #  here; nginx's job is just to get the request to the browser container.
    # =========================================================================
    server {
        listen      127.0.0.1:80;
        # listen    [::1]:80;             # enable on IPv6-capable hosts
        server_name px.tinyorbit.org;

        # Connection cap per client IP (applies to every location in this server).
        limit_conn conn_limit 50;

        # ---- Security headers ------------------------------------------------
        # Cloudflare adds HSTS at the edge when you enable it there; keep the
        # rest here so they survive even if you bypass the tunnel.
        add_header X-Content-Type-Options    "nosniff"        always;
        add_header X-Frame-Options           "SAMEORIGIN"     always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection          "0"              always;
        # add_header Content-Security-Policy "default-src 'self'" always;

        # ---- Health check ----------------------------------------------------
        # Cheap liveness probe answered by nginx itself: 200 means "the proxy is
        # up", independent of whether the backends are healthy. Used by the
        # setup scripts, by `docker compose` and by uptime monitors.
        location = /health {
            access_log off;
            # `default_type`, not `add_header Content-Type`: the latter would sit
            # alongside the inherited `application/octet-stream` and emit TWO
            # Content-Type headers, and clients may honour the first.
            default_type application/json;
            # add_header does not merge — a location that declares one replaces
            # the whole inherited set, so the server-level security headers have
            # to be repeated here or they are silently dropped.
            add_header X-Content-Type-Options    "nosniff"        always;
            add_header X-Frame-Options           "SAMEORIGIN"     always;
            add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
            add_header X-XSS-Protection          "0"              always;
            return 200 '{"status":"healthy","service":"nginx"}';
        }

        # ---- nginx runtime metrics (loopback only) ---------------------------
        # NOTE: on Docker Desktop for Mac, `host.docker.internal` NATs into the
        # host's loopback, so nginx sees 127.0.0.1 for connections originating in
        # ANY local container — this ACL does not exclude them. It only leaks
        # connection counters, but do not treat "allow 127.0.0.1" as a boundary
        # against containers on this host.
        location = /nginx-status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            allow ::1;
            deny  all;
        }

        # ---- Everything -> the browser container ------------------------------
        # One location handles both plain HTTP (the UI shell, static assets)
        # and the WebSocket stream the container uses to push frames/audio and
        # take input — KasmVNC-style apps don't confine that socket to its own
        # path prefix, so splitting this into separate /ws/ and / locations
        # (as the generic template did) doesn't apply here.
        #
        # Upgrade/Connection use $connection_upgrade (defined above): it
        # resolves to "upgrade" only when the request actually carries an
        # Upgrade header and "close" otherwise, so ordinary requests still get
        # normal keepalive — the same map the old dedicated /ws/ location used,
        # just applied to every request instead of one path prefix.
        location / {
            proxy_pass http://browser_backend;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host  $host;

            # A remote-desktop session sits open and mostly idle between
            # frames — without a long read/send timeout nginx would close it
            # after 60s. Cloudflare's own edge idle timeout is ~100s for
            # WebSockets, comfortably under this.
            proxy_connect_timeout 7s;
            proxy_send_timeout    1h;
            proxy_read_timeout    1h;

            proxy_buffering off;   # frames must not sit in a buffer
            proxy_cache     off;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        # ---- Error pages -----------------------------------------------------
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            internal;
            default_type text/html;
            # Repeated for the same add_header-does-not-merge reason as /health.
            add_header X-Content-Type-Options    "nosniff"        always;
            add_header X-Frame-Options           "SAMEORIGIN"     always;
            add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
            add_header X-XSS-Protection          "0"              always;
            return 503 '<!doctype html><title>Service unavailable</title><h1>503 — backend unavailable</h1><p>The application is restarting. Please retry in a moment.</p>';
        }
    }

}
