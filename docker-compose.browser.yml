# =============================================================================
#  docker-compose.browser.yml — the actual px.tinyorbit.org service.
#
#  A single containerized Firefox (KasmVNC-based), driven entirely through a
#  web page. This is what nginx/nginx.conf's px.tinyorbit.org vhost proxies
#  to: the whole point is that browsing happens inside this container, so a
#  malicious page can compromise the container's own throwaway filesystem at
#  worst, never this Mac's real filesystem or other processes.
#
#  Not to be confused with docker-compose.yml, which is a separate local test
#  rig for nginx.conf itself (mock backends, no real app) — see SETUP.md.
#
#    docker compose -f docker-compose.browser.yml up -d --wait
#    docker compose -f docker-compose.browser.yml down
#
#  Pair with scripts/start.sh / scripts/stop.sh, which already run these.
# =============================================================================

services:
  browser:
    image: lscr.io/linuxserver/firefox:latest
    container_name: px-browser
    restart: unless-stopped

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles

    # Loopback only — nothing but nginx on this host can reach it, same
    # convention as every other backend upstream in nginx.conf.
    ports:
      - "127.0.0.1:3000:3000"

    # linuxserver's documented minimum for modern sites (video playback etc.)
    shm_size: "1gb"

    # Cheap, safe hardening that doesn't risk breaking the KasmVNC/s6-overlay
    # boot sequence (unlike cap_drop/read_only, which these images generally
    # need default capabilities and a writable rootfs to even start — worth
    # revisiting once this is confirmed working).
    security_opt:
      - no-new-privileges:true

    # Bound so a hostile page can't turn this into a resource-exhaustion
    # vector for the rest of the host. Docker Desktop's VM only has 4 CPUs /
    # ~5.8GiB total here, shared with other containers.
    mem_limit: "2g"
    cpus: "2.0"
    pids_limit: 512

    # A named volume, NOT a host bind mount: the Firefox profile, cache and
    # any downloads live only inside Docker's own volume storage. Nothing a
    # session does becomes a file on this Mac's real filesystem, and
    # `scripts/reset-browser.sh` wipes it back to empty on demand.
    volumes:
      - browser-config:/config

volumes:
  browser-config:
