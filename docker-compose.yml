# =============================================================================
#  docker-compose.yml — local test rig for nginx/nginx.conf
#
#  Brings up the exact production nginx config in front of three mock backends
#  so you can exercise routing, load balancing, rate limiting, static caching
#  and WebSockets without a Cloudflare account or a real application.
#
#    docker compose up --build
#    curl -H 'Host: example.com' http://localhost:8080/health
#
#  See SETUP.md -> "Local testing with Docker" for the full test matrix.
#
#  Networking note: the mock backends deliberately join nginx's network
#  namespace (`network_mode: "service:nginx"`). That makes 127.0.0.1:3000,
#  :3001 and :5000 resolve inside the nginx container exactly as they would on
#  a real host, so nginx.conf runs here byte-for-byte identical to production —
#  no Docker-specific upstream names, no second copy of the config to drift.
#  Because they share one namespace, only the nginx service publishes ports.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  #  The real config under test. Port 80 in the container is published on 8080
  #  so it does not collide with anything already running on the host.
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: mock-nginx
    ports:
      - "8080:80"
    volumes:
      # Read-only: the container must never be able to edit the repo copy.
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      # Unknown Host headers get 444 by design, so the probe sends a real one.
      test: ["CMD", "wget", "-q", "--spider", "--header=Host: example.com", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  #  App tier — two instances, load balanced by `least_conn`. Hit / repeatedly
  #  and watch the `backend` field in the JSON alternate between them.
  # ---------------------------------------------------------------------------
  app-1:
    image: python:3.12-alpine
    container_name: mock-app-1
    network_mode: "service:nginx"
    depends_on:
      - nginx
    environment:
      PORT: "3000"
      BACKEND_NAME: "app-1"
      ENABLE_WS: "true"
    volumes:
      - ./docker/mock-backend/server.py:/srv/server.py:ro
    command: ["python3", "-u", "/srv/server.py"]
    healthcheck:
      # Lets `docker compose up --wait` block until the backend is actually
      # serving, instead of nginx ejecting it for fail_timeout seconds.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health').read()"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  app-2:
    image: python:3.12-alpine
    container_name: mock-app-2
    network_mode: "service:nginx"
    depends_on:
      - nginx
    environment:
      PORT: "3001"
      BACKEND_NAME: "app-2"
      ENABLE_WS: "true"
    volumes:
      - ./docker/mock-backend/server.py:/srv/server.py:ro
    command: ["python3", "-u", "/srv/server.py"]
    healthcheck:
      # Lets `docker compose up --wait` block until the backend is actually
      # serving, instead of nginx ejecting it for fail_timeout seconds.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/health').read()"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  #  API tier — single instance on :5000, reached via /api/ and via
  #  api.example.com.
  # ---------------------------------------------------------------------------
  api:
    image: python:3.12-alpine
    container_name: mock-api
    network_mode: "service:nginx"
    depends_on:
      - nginx
    environment:
      PORT: "5000"
      BACKEND_NAME: "api"
      ENABLE_WS: "false"
    volumes:
      - ./docker/mock-backend/server.py:/srv/server.py:ro
    command: ["python3", "-u", "/srv/server.py"]
    healthcheck:
      # Lets `docker compose up --wait` block until the backend is actually
      # serving, instead of nginx ejecting it for fail_timeout seconds.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health').read()"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  #  Optional: run the real tunnel against this stack.
  #
  #    docker compose --profile tunnel up
  #
  #  Requires ~/.cloudflared to already hold a config.yml and credentials —
  #  run scripts/setup-cloudflare-tunnel.sh first. Point the ingress rules at
  #  http://localhost:80 (this container shares nginx's namespace too).
  # ---------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: mock-cloudflared
    profiles: ["tunnel"]
    network_mode: "service:nginx"
    depends_on:
      - nginx
    volumes:
      - ${HOME}/.cloudflared:/etc/cloudflared:ro
    command: ["tunnel", "--config", "/etc/cloudflared/config.yml", "--no-autoupdate", "run"]
    restart: unless-stopped
